openapi: 3.0.3

info:
  title: Products API
  version: 1.0.0
  description: |
    RESTful API to manage products and their prices in different currencies.

    **How to authenticate**

    1. Call `POST /login` with the test user (`test@example.com` / `password`).
    2. Copy the `token` from the response.
    3. Click **Authorize**, paste the token and confirm.

    Tokens expire after 24 hours.

servers:
  - url: /api

tags:
  - name: Auth
  - name: Currencies
  - name: Products
  - name: Prices

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags: [Auth]
      summary: Get an access token
      description: Returns a Bearer token. Limited to 5 attempts per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthorized'

  /currencies:
    get:
      tags: [Currencies]
      summary: List currencies
      description: Exchange rates are expressed against USD.
      responses:
        '200':
          description: Currency list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: search
          in: query
          description: Filters products by name
          schema:
            type: string
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    get:
      tags: [Products]
      summary: Get a product
      description: Includes the base currency and the prices registered in other currencies.
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Products]
      summary: Update a product
      description: Only the fields to change need to be sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Products]
      summary: Delete a product
      description: The product is soft deleted.
      responses:
        '204':
          description: Product deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{product}/prices:
    parameters:
      - $ref: '#/components/parameters/ProductId'

    get:
      tags: [Prices]
      summary: List the prices of a product
      responses:
        '200':
          description: Price list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductPrice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Prices]
      summary: Register a price in another currency
      description: |
        If `price` is not sent, it is calculated from the product's base price
        and the exchange rates of both currencies.

        A product cannot have two prices in the same currency, and a price
        cannot be registered in the product's base currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPriceInput'
      responses:
        '201':
          description: Price created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductPrice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ProductId:
      name: product
      in: path
      required: true
      description: Product id
      schema:
        type: integer
        example: 1

  schemas:
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          example: password
        device_name:
          type: string
          nullable: true
          maxLength: 100
          example: postman

    Token:
      type: object
      properties:
        token:
          type: string
          example: 1|aBcD3fGh4iJkLmN0pQrStUvWxYz
        token_type:
          type: string
          example: Bearer

    Currency:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: EUR
        symbol:
          type: string
          example: €
        exchange_rate:
          type: string
          description: Units of this currency per 1 USD
          example: '0.920000'

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 11
        name:
          type: string
          example: Mechanical keyboard
        description:
          type: string
          nullable: true
          example: Red switches and backlight
        price:
          type: string
          description: Price in the base currency
          example: '120.50'
        currency_id:
          type: integer
          example: 1
        currency:
          $ref: '#/components/schemas/Currency'
        tax_cost:
          type: string
          example: '22.90'
        manufacturing_cost:
          type: string
          example: '60.00'
        prices:
          type: array
          description: Only included when getting a single product
          items:
            $ref: '#/components/schemas/ProductPrice'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [name, price, currency_id, tax_cost, manufacturing_cost]
      properties:
        name:
          type: string
          maxLength: 255
          example: Mechanical keyboard
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: Red switches and backlight
        price:
          type: number
          minimum: 0
          maximum: 9999999999.99
          example: 120.50
        currency_id:
          type: integer
          example: 1
        tax_cost:
          type: number
          minimum: 0
          maximum: 9999999999.99
          example: 22.90
        manufacturing_cost:
          type: number
          minimum: 0
          maximum: 9999999999.99
          example: 60

    ProductUpdateInput:
      type: object
      description: Same fields as ProductInput, all optional.
      properties:
        name:
          type: string
          maxLength: 255
          example: Mechanical keyboard TKL
        description:
          type: string
          nullable: true
          maxLength: 2000
        price:
          type: number
          minimum: 0
          maximum: 9999999999.99
          example: 110
        currency_id:
          type: integer
        tax_cost:
          type: number
          minimum: 0
          maximum: 9999999999.99
        manufacturing_cost:
          type: number
          minimum: 0
          maximum: 9999999999.99

    ProductPrice:
      type: object
      properties:
        id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 11
        price:
          type: string
          example: '115.00'
        currency:
          $ref: '#/components/schemas/Currency'
        created_at:
          type: string
          format: date-time

    ProductPriceInput:
      type: object
      required: [currency_id]
      properties:
        currency_id:
          type: integer
          example: 2
        price:
          type: number
          nullable: true
          minimum: 0
          maximum: 9999999999.99
          description: Optional. Calculated from the exchange rates when missing.
          example: 115

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
        last:
          type: string
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        from:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
        path:
          type: string
        per_page:
          type: integer
          example: 15
        to:
          type: integer
          example: 10
        total:
          type: integer
          example: 10

    Message:
      type: object
      properties:
        message:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Unauthenticated.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Resource not found.

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
          example:
            message: The price field is required.
            errors:
              price:
                - The price field is required.

    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Too Many Attempts.